# Every hour: the cycle writes/checks words and commits them to the branch "ai-words" (never to main).
# Needs: repo Secrets OPENROUTER_API_KEY, GROQ_API_KEY, GEMINI_API_KEY; repo Variable CYCLE_ENABLED=true.
name: hourly-cycle
on:
  schedule:
    - cron: "17 * * * *" # every hour (user's decision, 16 Nov 2026): GitHub often skips or delays scheduled runs, so the next one makes up for it
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: content-bot
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Switch to ai-words (created from main the first time) and bring in the admin's changes from main
        run: |
          git config user.name "iTmeans bot"
          git config user.email "bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ai-words >/dev/null; then
            git checkout -B ai-words origin/ai-words
            PREV=$(git rev-parse HEAD)
            git merge -X theirs --no-edit origin/main
            # on a clash main's queue file wins; put back the queue entries only ai-words had (published words point to them in "related")
            node scripts/merge-queue.mjs "$PREV"
          else
            git checkout -B ai-words origin/main
          fi
      - name: Apply the settings saved on the admin page (daily caps, stop all, subjects on/off)
        run: node scripts/sync-admin-settings.mjs
      - name: Give a permanent id to anything added without one
        run: node scripts/assign-ids.mjs
      - name: Check content before writing anything
        run: node scripts/validate-content.mjs
      - name: Fill the word list of any subtopic that is (almost) empty, e.g. one just added on the admin page
        continue-on-error: true
        env:
          CYCLE_ENABLED: ${{ vars.CYCLE_ENABLED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node agent/cycle/fill-queue.mjs --below=3
      - name: Check and publish drafts sent by contributors (files uploaded to content/drafts/)
        continue-on-error: true
        env:
          CYCLE_ENABLED: ${{ vars.CYCLE_ENABLED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node agent/cycle/ingest.mjs --inbox
      - name: Run one cycle
        env:
          CYCLE_ENABLED: ${{ vars.CYCLE_ENABLED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node agent/cycle/cycle.mjs --max=300
      - name: Summary
        if: always()
        run: node agent/cycle/summary.mjs
      - name: Check content again, then save to ai-words
        if: always()
        run: |
          node scripts/validate-content.mjs
          git add content
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -m "cycle: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin ai-words
          fi