# Builds the website (content check -> Astro -> Pagefind index) and publishes it on GitHub Pages.
# Runs when main changes in the site or its content, and also when daily-merge.yml starts it (pushes made with the
# workflow token do not start other workflows by themselves). One deploy at a time; a newer one waits, never cancels a running one.
name: deploy
on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "scripts/**", "agent/cycle/lib.mjs", "agent/cycle/checks.mjs", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_BASE: /${{ github.event.repository.name }}
      ASTRO_SITE: https://${{ github.repository_owner }}.github.io
      # Reader accounts: the Firebase web config of project itmeans-b5f02. These values are public by design (they only name the project;
      # access is decided by Firebase Auth + the Firestore rules), so they are written here instead of in secrets.
      PUBLIC_FIREBASE_API_KEY: AIzaSyCdQpIKND0-5f5VrVt2Q7La0PPevhwgdc4
      PUBLIC_FIREBASE_AUTH_DOMAIN: itmeans-b5f02.firebaseapp.com
      PUBLIC_FIREBASE_PROJECT_ID: itmeans-b5f02
      PUBLIC_FIREBASE_APP_ID: 1:470142818400:web:83cf188026f5b95f528b05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build (content check, Astro, Pagefind)
        working-directory: site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
