# Every hour (user's choice, 17 Nov 2026; before: every 6 hours, once a day): if ai-words has new content and passes the content check,
# merge it into main through a pull request. The file keeps its old name "daily-merge" so the links and the admin page still work.
name: daily-merge
on:
  schedule:
    - cron: "7,40 * * * *" # twice an hour, because GitHub skips many timed runs; nothing new = nothing happens
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: content-merge # own group: waiting behind a 40-minute word run made merges late or dropped them
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Anything to merge?
        id: diff
        run: |
          if ! git ls-remote --exit-code --heads origin ai-words >/dev/null; then echo "has=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet origin/main origin/ai-words -- content; then echo "has=no" >> "$GITHUB_OUTPUT"; else echo "has=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Content check on ai-words
        if: steps.diff.outputs.has == 'yes'
        run: |
          git checkout -B ai-words origin/ai-words
          node scripts/validate-content.mjs
      - name: Pull request and merge
        if: steps.diff.outputs.has == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head ai-words --title "New words $(date -u +%F-%H%M)" --body "Automatic: new and held words from the hourly cycle. Content check passed." || true
          gh pr merge ai-words --merge
          # a merge made with the workflow token does not start other workflows, so start the site deploy ourselves
          gh workflow run deploy.yml --ref main
      - name: Wake the word cycle (GitHub's hourly timer for it often does not fire; this 6-hourly one does)
        # only on the timer: when a word run starts this merge, waking the cycle again would make an endless loop of empty runs
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run list --workflow hourly-cycle.yml --status in_progress --limit 1 --json databaseId -q '.[0].databaseId' | grep -q .; then echo "cycle already running"; else gh workflow run hourly-cycle.yml --ref main; fi