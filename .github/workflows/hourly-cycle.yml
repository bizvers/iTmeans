# Every hour: the cycle writes/checks words and commits them to the branch "ai-words" (never to main).
# Needs: repo Secrets OPENROUTER_API_KEY, GROQ_API_KEY, GEMINI_API_KEY; repo Variable CYCLE_ENABLED=true.
name: hourly-cycle
on:
  schedule:
    - cron: "17 * * * *" # every hour (user's decision, 16 Nov 2026): GitHub often skips or delays scheduled runs, so the next one makes up for it
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write # to start the next run by itself
concurrency:
  group: content-bot
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Switch to ai-words (created from main the first time) and bring in the admin's changes from main
        run: |
          git config user.name "iTmeans bot"
          git config user.email "bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ai-words >/dev/null; then
            git checkout -B ai-words origin/ai-words
            PREV=$(git rev-parse HEAD)
            git merge -X theirs --no-edit origin/main
            # on a clash main's queue file wins; put back the queue entries only ai-words had (published words point to them in "related")
            node scripts/merge-queue.mjs "$PREV"
          else
            git checkout -B ai-words origin/main
          fi
      - name: Apply the settings saved on the admin page (daily caps, stop all, subjects on/off)
        run: node scripts/sync-admin-settings.mjs
      - name: Give a permanent id to anything added without one
        run: node scripts/assign-ids.mjs
      - name: Check content before writing anything
        run: node scripts/validate-content.mjs
      - name: Fill the word list of any subtopic that is (almost) empty, e.g. one just added on the admin page
        continue-on-error: true
        env:
          CYCLE_ENABLED: ${{ vars.CYCLE_ENABLED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node agent/cycle/fill-queue.mjs --below=3
      - name: Check and publish drafts sent by contributors (files uploaded to content/drafts/)
        continue-on-error: true
        env:
          CYCLE_ENABLED: ${{ vars.CYCLE_ENABLED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node agent/cycle/ingest.mjs --inbox
      - name: Run one cycle
        env:
          CYCLE_ENABLED: ${{ vars.CYCLE_ENABLED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        # Work in chunks of 100 words for up to 40 minutes, saving to ai-words after every chunk (a cut-off run no longer loses its work).
        # Stops when a chunk publishes nothing (free limits used up / nothing to do). If it stopped only because the time was up,
        # it starts the next run by itself, so the work goes on without waiting for GitHub's unreliable timer.
        run: |
          set -o pipefail
          START=$(date +%s); MORE=no
          while true; do
            RC=0; timeout 15m node agent/cycle/cycle.mjs --max=100 | tee /tmp/cycle-out.txt || RC=$?
            PUBLISHED=$(tail -n 1 /tmp/cycle-out.txt | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).published??0)}catch{console.log(0)}})')
            node scripts/validate-content.mjs || break
            git add content
            if ! git diff --cached --quiet; then git commit -m "cycle: $(date -u +%Y-%m-%dT%H:%MZ)"; git push origin ai-words || break; fi
            echo "chunk published: $PUBLISHED (exit $RC)"
            # cut off after 15 minutes (slow models): what it wrote is saved above; go on with a fresh chunk, the slow models are tried again
            if [ "$RC" = "124" ]; then CUTS=$(( ${CUTS:-0} + 1 )); if [ "$CUTS" -ge 2 ]; then echo "cut off twice: stop, the timer tries again"; break; fi; echo "chunk cut off after 15 minutes: next chunk"; if [ $(( $(date +%s) - START )) -gt 2400 ]; then MORE=yes; break; fi; continue; fi
            if [ "$PUBLISHED" = "0" ]; then echo "nothing published: stop (limits used up, nothing to do, or paused)"; break; fi
            if [ $(( $(date +%s) - START )) -gt 2400 ]; then MORE=yes; break; fi
          done
          echo "MORE=$MORE" >> "$GITHUB_ENV"
      - name: Summary
        if: always()
        run: node agent/cycle/summary.mjs
      - name: Check content again, then save to ai-words
        if: always()
        run: |
          node scripts/validate-content.mjs
          git add content
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -m "cycle: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin ai-words
          fi
      - name: Start the next run (only when this one stopped because its time was up, not because the free limits ended)
        if: env.MORE == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hourly-cycle.yml --ref main