# Every 6 hours (user's choice, 16 Nov 2026; it was once a day): if ai-words has new content and passes the content check,
# merge it into main through a pull request. The file keeps its old name "daily-merge" so the links and the admin page still work.
name: daily-merge
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: content-bot
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Anything to merge?
        id: diff
        run: |
          if ! git ls-remote --exit-code --heads origin ai-words >/dev/null; then echo "has=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet origin/main origin/ai-words -- content; then echo "has=no" >> "$GITHUB_OUTPUT"; else echo "has=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Content check on ai-words
        if: steps.diff.outputs.has == 'yes'
        run: |
          git checkout -B ai-words origin/ai-words
          node scripts/validate-content.mjs
      - name: Pull request and merge
        if: steps.diff.outputs.has == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head ai-words --title "New words $(date -u +%F-%H%M)" --body "Automatic: new and held words from the hourly cycle. Content check passed." || true
          gh pr merge ai-words --merge
          # a merge made with the workflow token does not start other workflows, so start the site deploy ourselves
          gh workflow run deploy.yml --ref main