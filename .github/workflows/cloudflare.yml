# Scale version on Cloudflare (docs/decisions.md, 22 Nov 2026): sends the words that changed to R2 and publishes the
# Worker at itmeans.org. Runs when main changes in the site or its content, and when daily-merge.yml starts it
# (like deploy.yml). The GitHub Pages site (deploy.yml) is not touched.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers + R2 + D1 edit rights; created by the owner, never in files).
# Without it the job says so and stops, without failing.
name: cloudflare
on:
  push:
    branches: [main]
    paths: ["site/**", "content/words/**", "content/taxonomy/**", "content/ui/**", "content/translations/**", "scripts/export-r2.mjs", "scripts/r2-upload-remote.mjs", "scripts/d1-sync.mjs", ".github/workflows/cloudflare.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e5ed2325b409cf04ad1e2e7a8a9f6bfe # not a secret: it only names the account
      ITM_TARGET: cloudflare
      # same public Firebase web config as deploy.yml (reader accounts)
      PUBLIC_FIREBASE_API_KEY: AIzaSyCdQpIKND0-5f5VrVt2Q7La0PPevhwgdc4
      PUBLIC_FIREBASE_AUTH_DOMAIN: itmeans-b5f02.firebaseapp.com
      PUBLIC_FIREBASE_PROJECT_ID: itmeans-b5f02
      PUBLIC_FIREBASE_APP_ID: 1:470142818400:web:83cf188026f5b95f528b05
    steps:
      - name: Token present?
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet; skipping the Cloudflare publish."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        if: steps.gate.outputs.go == 'yes'
        working-directory: site
        run: npm ci
      - name: Content check
        if: steps.gate.outputs.go == 'yes'
        run: node scripts/validate-content.mjs
      - name: Words to R2 (only what changed)
        if: steps.gate.outputs.go == 'yes'
        run: |
          node scripts/export-r2.mjs
          node scripts/r2-upload-remote.mjs --parallel=8
      # full-text search database (needs D1 Edit on the token); if it fails, the site is still published and the
      # search shows the previous words until the next run
      - name: Words to D1 search (only what changed)
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: node scripts/d1-sync.mjs --remote
      - name: Build (Cloudflare version)
        if: steps.gate.outputs.go == 'yes'
        working-directory: site
        run: npx astro build
      - name: Publish the Worker (itmeans.org)
        if: steps.gate.outputs.go == 'yes'
        working-directory: site
        run: npx wrangler deploy
